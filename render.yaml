services:
  - type: web
    name: xtream-streamplayer
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_ACCESS_TOKEN
        generateValue: true
      - key: TRUST_PROXY
        value: 1
