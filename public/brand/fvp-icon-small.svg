<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>FelixVisionPlayer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C2C2E"/>
      <stop offset="1" stop-color="#1C1C1E"/>
    </linearGradient>
    <radialGradient id="bgLight" cx="0.5" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Geometria (misurata sul prototipo) -->
    <g id="letters-raw">
      <path d="M140 333 H374 V421 H228 V478 H350 V562 H228 V688 H140 Z"/>
      <path fill-rule="evenodd" d="
        M640 333 H765 A133.5 133.5 0 0 1 765 600 H728 V688 H640 V562 L688 512 L640 462 Z
        M728 421 H765 A45.5 45.5 0 0 1 765 512 H728 Z"/>
    </g>
    <g id="play-raw">
      <!-- lato sinistro dritto, piccola tacca a V al centro -->
      <path d="M404 330 L658 512 L404 694 L404 586 L468 512 L404 438 Z"/>
    </g>

    <filter id="round" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="12"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0 0 0 1 1 1 1"/></feComponentTransfer>
    </filter>
    <filter id="roundPlay" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="10"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0 0 0 1 1 1 1"/></feComponentTransfer>
    </filter>

    <!-- Rilievo: luce dall'alto a sinistra -->
    <filter id="bevel" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="bump"/>
      <feSpecularLighting in="bump" surfaceScale="14" specularConstant="1.25" specularExponent="48" lighting-color="#E9FFF6" result="spec">
        <feDistantLight azimuth="235" elevation="38"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
      <!-- ombra interna in basso a destra -->
      <feSpecularLighting in="bump" surfaceScale="14" specularConstant="1" specularExponent="30" lighting-color="#ffffff" result="back">
        <feDistantLight azimuth="55" elevation="38"/>
      </feSpecularLighting>
      <feComposite in="back" in2="SourceAlpha" operator="in" result="backIn"/>
      <feComposite in="SourceGraphic" in2="backIn" operator="arithmetic" k1="0" k2="1" k3="-0.35" k4="0" result="dark"/>
      <feComposite in="dark" in2="specIn" operator="arithmetic" k1="0" k2="1" k3="0.85" k4="0" result="lit"/>
      <feComposite in="lit" in2="SourceAlpha" operator="in"/>
    </filter>
    <!-- Bordo luminoso su tutto il contorno -->
    <filter id="rim" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology in="SourceAlpha" operator="erode" radius="5" result="e"/>
      <feComposite in="SourceAlpha" in2="e" operator="out" result="edge"/>
      <feGaussianBlur in="edge" stdDeviation="1.1" result="edgeS"/>
      <feFlood flood-color="#BDF5DE"/>
      <feComposite in2="edgeS" operator="in"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>

    <mask id="mLetters"><g fill="#fff" filter="url(#round)"><use href="#letters-raw"/></g></mask>
    <mask id="mPlay"><g fill="#fff" filter="url(#roundPlay)"><use href="#play-raw"/></g></mask>

    <linearGradient id="glassLetters" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12A170"/>
      <stop offset="0.5" stop-color="#0B7F57"/>
      <stop offset="1" stop-color="#075C40"/>
    </linearGradient>
    <linearGradient id="glassPlay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7EF0C4"/>
      <stop offset="0.45" stop-color="#2FD69E"/>
      <stop offset="1" stop-color="#12B981"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sfondo a tutto quadro (gli angoli li arrotonda il sistema) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#bgLight)"/>

  <!-- Versione per misure piccole (sotto 64 px): stessa forma, colori pieni, leggero rilievo -->
  <rect width="1024" height="1024" fill="#0E8F63" mask="url(#mLetters)"/>
  <rect width="1024" height="1024" fill="#34D399" mask="url(#mPlay)"/>
</svg>
