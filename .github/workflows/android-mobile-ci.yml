name: Android Mobile CI

on:
  push:
    paths:
      - "apps/android-mobile/**"
      - "apps/android-tv/app/src/main/java/it/felixvision/tv/data/**"
      - "apps/android-tv/app/src/main/java/it/felixvision/tv/core/**"
      - "apps/android-tv/gradle/libs.versions.toml"
      - ".github/workflows/android-mobile-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/android-mobile/**"
      - "apps/android-tv/app/src/main/java/it/felixvision/tv/data/**"
      - "apps/android-tv/app/src/main/java/it/felixvision/tv/core/**"
      - "apps/android-tv/gradle/libs.versions.toml"
      - ".github/workflows/android-mobile-ci.yml"
  workflow_dispatch:

concurrency:
  group: android-mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nessun segreto: la build di debug e i test non richiedono credenziali.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Imposta JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            apps/android-mobile/**/*.gradle*
            apps/android-mobile/**/*.toml
            apps/android-tv/gradle/libs.versions.toml

      - name: Accetta le licenze Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Test, assembleDebug e lint
        working-directory: apps/android-mobile
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug lintDebug --console=plain --stacktrace 2>&1 | tee /tmp/fvp-mobile-build.log

      # Gli errori del compilatore Kotlin ("e: file://...:riga:colonna ..."), i test
      # falliti (XML JUnit) e gli errori di lint diventano annotazioni GitHub così
      # restano leggibili dalla pagina del run, dalla PR e via API (i log di blob
      # alcune reti non li raggiungono).
      - name: Annota errori di compilazione, test e lint
        if: failure()
        shell: bash
        run: |
          set +e
          sed -n -E "s|^e: file://$GITHUB_WORKSPACE/([^:]+):([0-9]+):([0-9]+) (.*)$|::error file=\1,line=\2,col=\3::\4|p" /tmp/fvp-mobile-build.log | head -40
          grep -E "^(e:|> Task .* FAILED)" /tmp/fvp-mobile-build.log | head -6 || true
          if [ -f apps/android-mobile/app/build/reports/lint-results-debug.txt ]; then
            sed -n -E "s|^$GITHUB_WORKSPACE/([^:]+):([0-9]+) Error: (.*)$|::error file=\1,line=\2::lint: \3|p" apps/android-mobile/app/build/reports/lint-results-debug.txt | head -20
          fi
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          for path in glob.glob('apps/android-mobile/app/build/test-results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  cid = (case.get('classname') or '').replace('.', '/') + '.kt'
                  for f in list(case):
                      if f.tag in ('failure', 'error'):
                          body = f.text or f.get('message') or ''
                          lines = [re.sub(r'\s+', ' ', ln).strip()[:180]
                                   for ln in body.split('\n') if ln.strip()][:10]
                          # linea riga della traccia dentro ai nostri test
                          for ln in body.split('\n'):
                              m = re.search(r'\((CatalogViewModelTest|HomeScreenTest|AccessViewModelTest|LoginScreenTest)\.kt:(\d+)\)', ln)
                              if m:
                                  lines.append(f"__AT__ {m.group(1)}.kt:{m.group(2)}")
                                  break
                          text = ' || '.join(lines)[:1500]
                          print(f"::error file={cid},line=1::test «{case.get('name','?')}»: {text}")
          PY

      - name: Carica l'APK di debug
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FelixVP-mobile-debug
          path: apps/android-mobile/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: ignore

      - name: Carica i report di test e lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-mobile-ci-reports
          path: |
            apps/android-mobile/app/build/reports/tests
            apps/android-mobile/app/build/reports/lint-results*
          if-no-files-found: ignore
