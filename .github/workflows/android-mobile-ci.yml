name: Android Mobile CI

on:
  push:
    paths:
      - "apps/android-mobile/**"
      - "apps/android-tv/app/src/main/java/it/felixvision/tv/data/**"
      - "apps/android-tv/app/src/main/java/it/felixvision/tv/core/**"
      - "apps/android-tv/gradle/libs.versions.toml"
      - ".github/workflows/android-mobile-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/android-mobile/**"
      - "apps/android-tv/app/src/main/java/it/felixvision/tv/data/**"
      - "apps/android-tv/app/src/main/java/it/felixvision/tv/core/**"
      - "apps/android-tv/gradle/libs.versions.toml"
      - ".github/workflows/android-mobile-ci.yml"
  workflow_dispatch:

concurrency:
  group: android-mobile-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# La firma di debug fissa usa un secret opzionale; test e build funzionano anche senza.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Imposta JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            apps/android-mobile/**/*.gradle*
            apps/android-mobile/**/*.toml
            apps/android-tv/gradle/libs.versions.toml

      - name: Accetta le licenze Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Prepara la chiave di debug fissa
        shell: bash
        env:
          FVP_DEBUG_KEYSTORE_BASE64: ${{ secrets.FVP_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "$FVP_DEBUG_KEYSTORE_BASE64" ]]; then
            key="$RUNNER_TEMP/fvp-debug.keystore"
            python3 - "$key" <<'PY'
          import base64, os, pathlib, re, subprocess, sys
          encoded = os.environ['FVP_DEBUG_KEYSTORE_BASE64'].strip().strip('"').strip("'")
          if encoded.lower().startswith('base64:'):
              encoded = encoded.split(':', 1)[1]
          if encoded.startswith('data:') and ',' in encoded:
              encoded = encoded.split(',', 1)[1]
          encoded = re.sub(r'[^A-Za-z0-9+/=_-]', '', encoded).replace('-', '+').replace('_', '/')
          encoded = encoded.replace('=', '')
          encoded += '=' * (-len(encoded) % 4)
          try:
              content = base64.b64decode(encoded, validate=True)
          except Exception:
              print('::error::FVP_DEBUG_KEYSTORE_BASE64 non è Base64 valido')
              raise SystemExit(1)
          path = pathlib.Path(sys.argv[1])
          candidate = content
          valid = False
          for _ in range(3):
              path.write_bytes(candidate)
              path.chmod(0o600)
              check = subprocess.run(['keytool', '-list', '-keystore', str(path), '-storepass', 'android', '-alias', 'androiddebugkey'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if check.returncode == 0:
                  valid = True
                  break
              try:
                  candidate = base64.b64decode(candidate.strip(), validate=True)
              except Exception:
                  break
          if not valid:
              path.unlink(missing_ok=True)
              print('::error::Keystore debug non valido: verificare che il secret contenga il keystore con alias androiddebugkey e password android')
              raise SystemExit(1)
          PY
            echo "FVP_DEBUG_KEYSTORE_PATH=$key" >> "$GITHUB_ENV"
          else
            echo "::warning::Chiave di debug fissa assente: l'APK avrà una firma diversa a ogni run"
          fi

      - name: Test, assembleDebug e lint
        working-directory: apps/android-mobile
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest assembleDebug lintDebug --console=plain --stacktrace 2>&1 | tee /tmp/fvp-mobile-build.log

      - name: Impronta certificato APK debug
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          apk="apps/android-mobile/app/build/outputs/apk/debug/app-debug.apk"
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          fingerprint=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test -n "$fingerprint"
          echo "Certificato SHA-256 APK debug: $fingerprint"
          echo "::notice::Certificato SHA-256 APK debug: $fingerprint"

      - name: Diagnostica temporanea del task Gradle fallito
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          lines = Path('/tmp/fvp-mobile-build.log').read_text(errors='replace').splitlines()
          patterns = re.compile(r'FAILURE:|What went wrong|Execution failed for task|FAILED|Lint found|Issues found|^e: file://|^w: file://')
          selected = [(i, line) for i, line in enumerate(lines) if patterns.search(line)]
          for i, line in selected[-40:]:
              print(f"build-log:{i + 1}: {line[:600]}")
              for following in lines[i + 1:min(i + 4, len(lines))]:
                  if following.strip(): print(f"build-log:  {following[:600]}")
          PY

      # GitHub mostra al massimo 10 annotazioni per tipo per passo e 50 per job:
      # gli errori principali devono comparire per primi — prima il compilatore,
      # poi i test, infine il lint. I log di blob non sono raggiungibili da
      # tutte le reti: le annotazioni restano leggibili dalla pagina del run,
      # dalla PR e via API.
      - name: Annota errori di compilazione, test e lint
        if: always()
        shell: bash
        run: |
          set +e
          # 1) errori del compilatore Kotlin ("e: file://...:riga:colonna ...")
          sed -n -E "s|^e: file://$GITHUB_WORKSPACE/([^:]+):([0-9]+):([0-9]+) (.*)$|::error file=\1,line=\2,col=\3::\4|p" /tmp/fvp-mobile-build.log | head -10
          # 2) test falliti: classe, nome del test, prime righe e primo frame
          #    interno dei test (pattern generico "(NomeTest.kt:N)")
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          tot = fail = err = 0
          for path in glob.glob('apps/android-mobile/app/build/test-results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              tot += int(root.get('tests') or 0)
              fail += int(root.get('failures') or 0)
              err += int(root.get('errors') or 0)
              for case in root.iter('testcase'):
                  cid = (case.get('classname') or '').replace('.', '/') + '.kt'
                  for f in list(case):
                      if f.tag in ('failure', 'error'):
                          body = f.text or f.get('message') or ''
                          lines = [re.sub(r'\s+', ' ', ln).strip()[:180]
                                   for ln in body.split('\n') if ln.strip()][:10]
                          for ln in body.split('\n'):
                              m = re.search(r'\((\w+Test\.kt:\d+)\)', ln)
                              if m:
                                  lines.append(f"__AT__ {m.group(1)}")
                                  break
                          text = ' || '.join(lines)[:1500]
                          print(f"::error file={cid},line=1::test «{case.get('name','?')}»: {text}")
          if tot:
              name = f"apps/android-mobile/app/src/test/java/it/felixvision/mobile/ui/main/HomeScreenTest.kt"
              print(f"::notice file={name},line=1::test eseguiti: {tot}, falliti: {fail}, errori: {err}, superati: {tot - fail - err}")
          PY
          # 3) errori di lint
          if [ -f apps/android-mobile/app/build/reports/lint-results-debug.txt ]; then
            sed -n -E "s|^$GITHUB_WORKSPACE/([^:]+):([0-9]+) Error: (.*)$|::error file=\1,line=\2::lint: \3|p" apps/android-mobile/app/build/reports/lint-results-debug.txt | head -10
          fi

      - name: Carica l'APK di debug
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: FelixVP-mobile-debug
          path: apps/android-mobile/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: ignore

      - name: Carica i report di test e lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-mobile-ci-reports
          path: |
            apps/android-mobile/app/build/reports/tests
            apps/android-mobile/app/build/reports/lint-results*
          if-no-files-found: ignore

      - name: Rimuovi la chiave di debug temporanea
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/fvp-debug.keystore"
