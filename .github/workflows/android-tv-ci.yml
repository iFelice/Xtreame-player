name: Android TV CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/android-tv/**"
      - ".github/workflows/android-tv-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/android-tv/**"
      - ".github/workflows/android-tv-ci.yml"

concurrency:
  group: android-tv-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Imposta JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: apps/android-tv/**/*.gradle*

      - name: Accetta le licenze Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Test unitari e lint
        working-directory: apps/android-tv
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Carica i report in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-ci-reports
          path: |
            apps/android-tv/app/build/reports/tests
            apps/android-tv/app/build/reports/lint-results*
          if-no-files-found: ignore
