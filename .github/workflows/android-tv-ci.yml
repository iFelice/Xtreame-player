name: Android TV CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/android-tv/**"
      - ".github/workflows/android-tv-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/android-tv/**"
      - ".github/workflows/android-tv-ci.yml"

concurrency:
  group: android-tv-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Imposta JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: apps/android-tv/**/*.gradle*

      - name: Accetta le licenze Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Test unitari e lint
        working-directory: apps/android-tv
        shell: bash
        run: ./gradlew testDebugUnitTest lintDebug 2>&1 | tee /tmp/fvp-tv-build.log

      # GitHub mostra al massimo 10 annotazioni per tipo per passo e 50 per job:
      # gli errori principali devono comparire per primi — prima il compilatore,
      # poi i test, infine il lint. I log di blob non sono raggiungibili da
      # tutte le reti: le annotazioni restano leggibili dalla pagina del run,
      # dalla PR e via API.
      - name: Annota errori di compilazione, test e lint
        if: always()
        shell: bash
        run: |
          set +e
          # 1) errori del compilatore Kotlin ("e: file://...:riga:colonna ...")
          sed -n -E "s|^e: file://$GITHUB_WORKSPACE/([^:]+):([0-9]+):([0-9]+) (.*)$|::error file=\1,line=\2,col=\3::\4|p" /tmp/fvp-tv-build.log | head -10
          # 2) test falliti: classe, nome del test, prime righe e primo frame
          #    interno dei test (pattern generico "(NomeTest.kt:N)")
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          tot = fail = err = 0
          for path in glob.glob('apps/android-tv/app/build/test-results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              tot += int(root.get('tests') or 0)
              fail += int(root.get('failures') or 0)
              err += int(root.get('errors') or 0)
              for case in root.iter('testcase'):
                  cid = (case.get('classname') or '').replace('.', '/') + '.kt'
                  for f in list(case):
                      if f.tag in ('failure', 'error'):
                          body = f.text or f.get('message') or ''
                          lines = [re.sub(r'\s+', ' ', ln).strip()[:180]
                                   for ln in body.split('\n') if ln.strip()][:10]
                          for ln in body.split('\n'):
                              m = re.search(r'\((\w+Test\.kt:\d+)\)', ln)
                              if m:
                                  lines.append(f"__AT__ {m.group(1)}")
                                  break
                          text = ' || '.join(lines)[:1500]
                          print(f"::error file={cid},line=1::test «{case.get('name','?')}»: {text}")
          if tot:
              print(f"::notice::test eseguiti: {tot}, falliti: {fail}, errori: {err}, superati: {tot - fail - err}")
          PY
          # 3) errori di lint
          if [ -f apps/android-tv/app/build/reports/lint-results-debug.txt ]; then
            sed -n -E "s|^$GITHUB_WORKSPACE/([^:]+):([0-9]+) Error: (.*)$|::error file=\1,line=\2::lint: \3|p" apps/android-tv/app/build/reports/lint-results-debug.txt | head -10
          fi

      - name: Carica i report in caso di errore
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-tv-ci-reports
          path: |
            apps/android-tv/app/build/reports/tests
            apps/android-tv/app/build/reports/lint-results*
          if-no-files-found: ignore
